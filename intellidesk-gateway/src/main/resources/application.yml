server:
  port: 8080

spring:
  application:
    name: intellidesk-gateway

  config:
    import: nacos:${NACOS_SERVER_ADDR:localhost:8848}?namespace=${NACOS_NAMESPACE:public}

  profiles:
    active: dev

  cloud:
    nacos:
      discovery:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
        group: DEFAULT_GROUP
        username: nacos
        password: nacos
      config:
        server-addr: ${NACOS_SERVER_ADDR:localhost:8848}
        namespace: ${NACOS_NAMESPACE:public}
        file-extension: yaml
        group: DEFAULT_GROUP
        username: nacos
        password: nacos
        shared-configs:
          - data-id: common-config.yaml
            refresh: true

    gateway:
      discovery:
        locator:
          enabled: true
          lower-case-service-id: true
      routes:
        # 用户服务路由
        - id: user-service
          uri: lb://intellidesk-user-service
          predicates:
            - Path=/api/user/**
          filters:
            - StripPrefix=1

        # 会话服务路由
        - id: chat-service
          uri: lb://intellidesk-chat-service
          predicates:
            - Path=/api/chat/**
          filters:
            - StripPrefix=1

        # 工单服务路由
        - id: ticket-service
          uri: lb://intellidesk-ticket-service
          predicates:
            - Path=/api/ticket/**
          filters:
            - StripPrefix=1

        # AI 服务路由
        - id: ai-service
          uri: lb://intellidesk-ai-service
          predicates:
            - Path=/api/ai/**
          filters:
            - StripPrefix=1

      # 全局CORS配置
      globalcors:
        cors-configurations:
          '[/**]':
            allowed-origin-patterns: "*"
            allowed-methods: "*"
            allowed-headers: "*"
            allow-credentials: true
            max-age: 3600

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:redis123}
      timeout: 3000ms
      database: 0



# 认证配置
auth:
  enabled: true
  whitelist:
    # 登录接口
    - /api/user/auth/login
    - /api/user/auth/register
    # 健康检查
    - /api/user/health
    - /api/user/health/**
    - /api/chat/health
    - /api/ticket/health
    - /api/ai/health
    # Actuator 端点
    - /actuator/**
    # Swagger/Knife4j 文档
    - /doc.html
    - /swagger-resources/**
    - /v3/api-docs/**
    - /webjars/**
    # 静态资源
    - /favicon.ico
    - /static/**

# Actuator 监控端点
management:
  endpoints:
    web:
      exposure:
        include: '*'
  endpoint:
    health:
      show-details: always

# 日志配置
logging:
  level:
    root: INFO
    com.intellidesk: DEBUG
    org.springframework.cloud.gateway: DEBUG
  pattern:
    console: '%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{50} - %msg%n'
